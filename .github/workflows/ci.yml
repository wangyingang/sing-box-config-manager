name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6; packageManager pins pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace
        run: |
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            pnpm check
          } 2>&1 | tee "$RUNNER_TEMP/workspace-check.log"
      - name: Preserve check log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workspace-check-${{ github.sha }}
          path: ${{ runner.temp }}/workspace-check.log
          retention-days: 14
          if-no-files-found: warn

  native:
    name: Native sing-box
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6; packageManager pins pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read sing-box build configuration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const build = JSON.parse(readFileSync('packages/config-compiler/schemas/build.json', 'utf8'));
          const version = build.version;
          const sha256 = build.releaseAssets?.['linux-amd64']?.sha256;
          if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/.test(version)) {
            throw new Error('Invalid sing-box version in schemas/build.json');
          }
          if (typeof sha256 !== 'string' || !/^[a-f0-9]{64}$/.test(sha256)) {
            throw new Error('Missing or invalid linux-amd64 release SHA-256 in schemas/build.json');
          }
          appendFileSync(process.env.GITHUB_ENV, `SING_BOX_VERSION=${version}\nSING_BOX_ARCHIVE_SHA256=${sha256}\n`);
          NODE
      - name: Install verified sing-box release
        run: |
          {
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 3 \
              "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" \
              --output sing-box.tar.gz
            echo "$SING_BOX_ARCHIVE_SHA256  sing-box.tar.gz" | sha256sum --check
            tar -xzf sing-box.tar.gz
            binary="$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
            test -x "$binary"
            "$binary" version
            echo "SING_BOX_TEST_BINARY=$binary" >> "$GITHUB_ENV"
          } 2>&1 | tee "$RUNNER_TEMP/native-install.log"
      - name: Run native integration tests
        run: |
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            pnpm test:integration
          } 2>&1 | tee "$RUNNER_TEMP/native-integration.log"
      - name: Preserve native logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-sing-box-${{ github.sha }}
          path: ${{ runner.temp }}/native-*.log
          retention-days: 14
          if-no-files-found: warn
