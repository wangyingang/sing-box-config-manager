name: Isolated rule operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Rule operation (production automation is delivered by Spec 86)
        type: choice
        options: [status, sync, pin, resume, cleanup]
        default: status
      target:
        description: Prepared acceptance-* artifact branch; main is rejected
        type: string
        required: true
      id:
        description: Rule ID for status, pin or resume
        type: string
      version:
        description: Retained version ID for pin
        type: string
      dry_run:
        description: Preview a write operation without changing remote state
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rule-maintenance-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RULE_OPERATION: ${{ inputs.operation }}
      RULE_TARGET: ${{ inputs.target }}
      RULE_ID: ${{ inputs.id }}
      RULE_VERSION: ${{ inputs.version }}
      RULE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Require isolated target
        shell: bash
        run: '[[ "$RULE_TARGET" =~ ^acceptance-[a-zA-Z0-9._-]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install verified sing-box
        if: inputs.operation != 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          build=packages/config-compiler/schemas/build.json
          version=$(jq -er .version "$build")
          digest=$(jq -er '.releaseAssets["linux-amd64"].sha256' "$build")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ && $digest =~ ^[a-f0-9]{64}$ ]]
          name="sing-box-${version}-linux-amd64"
          cd "$RUNNER_TEMP"
          if ! curl --fail --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${name}.tar.gz" \
            --output "${name}.tar.gz"; then
            echo 'Release download failed. Retrying through the GitHub Release Assets API.'
            asset_id=$(gh api "repos/SagerNet/sing-box/releases/tags/v${version}" |
              jq -er --arg name "${name}.tar.gz" '.assets[] | select(.name == $name) | .id')
            [[ $asset_id =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/SagerNet/sing-box/releases/assets/${asset_id}" > "${name}.tar.gz"
          fi
          printf '%s  %s\n' "$digest" "${name}.tar.gz" | sha256sum --check
          tar -xzf "${name}.tar.gz"
          test -x "$RUNNER_TEMP/$name/sing-box"
          printf 'SING_BOX_BINARY=%s/%s/sing-box\n' "$RUNNER_TEMP" "$name" >> "$GITHUB_ENV"
      - name: Run isolated rule operation
        working-directory: packages/rule-set-pipeline
        env:
          GH_TOKEN: ${{ secrets.RULE_ARTIFACT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          trap 'cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/rule-maintenance-summary.md"' EXIT
          node --import tsx src/rule-workflow.ts
      - name: Preserve rule maintenance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rule-maintenance-summary
          path: ${{ runner.temp }}/rule-maintenance-summary.md
          retention-days: 14
          if-no-files-found: warn
