name: Rule operations
run-name: Rules ${{ github.event_name }} · ${{ github.event_name == 'push' && github.ref_name || inputs.target || 'main' }} · ${{ inputs.operation || 'sync' }}

on:
  push:
    branches: [main, 'acceptance-*']
    paths: ['packages/rule-set-pipeline/config/rulesets.yml']
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Rule operation
        type: choice
        options: [status, sync, pin, resume, cleanup]
        default: status
      target:
        description: Artifact target (main or a prepared acceptance-* configuration and artifact branch)
        type: string
        default: main
      id:
        description: Rule ID for status, pin or resume
        type: string
      version:
        description: Retained version ID for pin
        type: string
      dry_run:
        description: Preview a write operation without changing remote state
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rule-maintenance-${{ github.event_name == 'push' && github.ref_name || inputs.target || 'main' }}
  cancel-in-progress: false

jobs:
  operate:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RULE_OPERATION: ${{ inputs.operation }}
      RULE_EVENT_NAME: ${{ github.event_name }}
      RULE_TARGET: ${{ github.event_name == 'push' && github.ref_name || inputs.target || 'main' }}
      RULE_CONFIG_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.target || 'main' }}
      RULE_UPDATE_ENABLED: ${{ vars.RULE_UPDATE_ENABLED }}
      RULE_CLEANUP_ENABLED: ${{ vars.RULE_CLEANUP_ENABLED }}
      RULE_ID: ${{ inputs.id }}
      RULE_VERSION: ${{ inputs.version }}
      RULE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Validate execution target
        shell: bash
        run: |
          if [[ "$RULE_TARGET" == main ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$RULE_CONFIG_BRANCH" == main ]]
          else
            [[ "$RULE_TARGET" =~ ^acceptance-[a-zA-Z0-9._-]+$ && "$RULE_CONFIG_BRANCH" == "$RULE_TARGET" ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Reruns inspect the current configuration branch, never replay event intent.
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install verified sing-box
        if: >-
          inputs.operation != 'status' &&
          (env.RULE_TARGET != 'main' || inputs.dry_run == true ||
           (inputs.operation != 'cleanup' && env.RULE_UPDATE_ENABLED == 'true') ||
           ((github.event_name == 'schedule' || inputs.operation == 'cleanup') && env.RULE_CLEANUP_ENABLED == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          build=packages/config-compiler/schemas/build.json
          version=$(jq -er .version "$build")
          digest=$(jq -er '.releaseAssets["linux-amd64"].sha256' "$build")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ && $digest =~ ^[a-f0-9]{64}$ ]]
          name="sing-box-${version}-linux-amd64"
          cd "$RUNNER_TEMP"
          if ! curl --fail --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${name}.tar.gz" \
            --output "${name}.tar.gz"; then
            echo 'Release download failed. Retrying through the GitHub Release Assets API.'
            asset_id=$(gh api "repos/SagerNet/sing-box/releases/tags/v${version}" |
              jq -er --arg name "${name}.tar.gz" '.assets[] | select(.name == $name) | .id')
            [[ $asset_id =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/SagerNet/sing-box/releases/assets/${asset_id}" > "${name}.tar.gz"
          fi
          printf '%s  %s\n' "$digest" "${name}.tar.gz" | sha256sum --check
          tar -xzf "${name}.tar.gz"
          test -x "$RUNNER_TEMP/$name/sing-box"
          printf 'SING_BOX_BINARY=%s/%s/sing-box\n' "$RUNNER_TEMP" "$name" >> "$GITHUB_ENV"
      - name: Run rule operations
        working-directory: packages/rule-set-pipeline
        env:
          RULE_RESULT_PATH: ${{ runner.temp }}/rule-result.json
          RULE_ARTIFACT_TOKEN: ${{ secrets.RULE_ARTIFACT_TOKEN }}
          RULE_ACCEPTANCE_TOKEN: ${{ secrets.RULE_ACCEPTANCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$RULE_TARGET" == main ]]; then
            export GH_TOKEN="$RULE_ARTIFACT_TOKEN"
          else
            export GH_TOKEN="$RULE_ACCEPTANCE_TOKEN"
            [[ -n "$GH_TOKEN" ]] || { echo 'RULE_ACCEPTANCE_TOKEN is required for isolated Actions runs'; exit 1; }
          fi
          unset RULE_ARTIFACT_TOKEN RULE_ACCEPTANCE_TOKEN
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          writeFileSync(`${env.RUNNER_TEMP}/rule-execution.json`, JSON.stringify({
            runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT,
            eventSha: env.GITHUB_SHA, workflowSha: env.GITHUB_WORKFLOW_SHA,
            checkoutCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
          }, null, 2) + '\n');
          NODE
          trap 'cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/rule-maintenance-summary.md"' EXIT
          node --import tsx src/rule-workflow.ts
      - name: Preserve rule operation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rule-maintenance-result
          overwrite: true
          path: |
            ${{ runner.temp }}/rule-maintenance-summary.md
            ${{ runner.temp }}/rule-result.json
            ${{ runner.temp }}/rule-execution.json
          retention-days: 14
          if-no-files-found: warn
