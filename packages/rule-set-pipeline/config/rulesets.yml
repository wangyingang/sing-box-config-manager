# yaml-language-server: $schema=./rulesets.schema.json
schemaVersion: 4
# 候选保留策略为 30 天，由 cleanup 执行；当前交付不受保留期限制。
candidateRetentionDays: 30
target:
  repository: wangyingang/sing-box-rule-artifacts
  branch: main
sources:
  dlc:
    fetch:
      method: url
      url: https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat_plain.yml
      sha256Url: https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat_plain.yml.sha256sum
    format: v2fly-dlc-yaml
  china-operator-ip:
    fetch:
      method: github-branch
      repository: gaoyifan/china-operator-ip
      branch: ip-lists
  openai-voice:
    fetch:
      method: url
      url: https://openai.com/chatgpt-voice.json
    format: openai-voice-json
  loyalsoldier:
    fetch:
      method: github-branch
      repository: Loyalsoldier/v2ray-rules-dat
      branch: release
  blackmatrix7:
    fetch:
      method: github-branch
      repository: blackmatrix7/ios_rule_script
      branch: master
  sukka:
    fetch:
      method: github-branch
      repository: SukkaLab/ruleset.skk.moe
      branch: master
ruleSets:
  openai:
    data:
      source: dlc
      list: openai
    publishPath: stable/openai
    artifact: domains
  anthropic:
    data:
      source: dlc
      list: anthropic
    publishPath: stable/anthropic
    artifact: domains
  google-deepmind:
    data:
      source: dlc
      list: google-deepmind
    publishPath: stable/google-deepmind
    artifact: domains
  china-ip:
    data:
      source: china-operator-ip
      file: china46.txt
      format: cidr-text
    publishPath: stable/china-ip
    artifact: ips
  chatgpt-voice:
    data:
      source: openai-voice
    publishPath: stable/chatgpt-voice
    artifact: ips
  china-domains:
    data:
      source: dlc
      list: geolocation-cn
    publishPath: stable/china-domains
    artifact: domains
  global:
    data:
      source: dlc
      list: geolocation-!cn
    publishPath: stable/global
    artifact: domains
  apple:
    data:
      source: dlc
      list: apple
    publishPath: stable/apple
    artifact: domains
  microsoft:
    data:
      source: dlc
      list: microsoft
    publishPath: stable/microsoft
    artifact: domains
  docker:
    data:
      source: dlc
      list: docker
    publishPath: stable/docker
    artifact: domains
  github:
    data:
      source: dlc
      list: github
    publishPath: stable/github
    artifact: domains
  google:
    data:
      source: dlc
      list: google
    publishPath: stable/google
    artifact: domains
  youtube:
    data:
      source: dlc
      list: youtube
    publishPath: stable/youtube
    artifact: domains
  gfw:
    data:
      source: loyalsoldier
      file: gfw.txt
      format: domain-suffix-text
    publishPath: stable/gfw
    artifact: domains
  onedrive:
    data:
      source: blackmatrix7
      file: rule/Clash/OneDrive/OneDrive.list
      format: clash-rule-list
    filter:
      include:
        type:
          anyOf: [DOMAIN-SUFFIX, DOMAIN-KEYWORD]
    publishPath: stable/onedrive
    artifact: domains
  stream:
    data:
      source: sukka
      file: sing-box/non_ip/stream.json
      format: sing-box-source-json
    publishPath: stable/stream
    artifact: domains
