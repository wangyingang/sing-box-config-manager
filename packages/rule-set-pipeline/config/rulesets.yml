schemaVersion: 3
# 候选保留策略为 30 天，由 cleanup 执行；当前交付不受保留期限制。
candidateRetentionDays: 30
target:
  repository: wangyingang/sing-box-rule-artifacts
  branch: main
sources:
  dlc:
    repository: v2fly/domain-list-community
    version: latest-release
    input:
      format: plain-yaml
      asset: dlc.dat_plain.yml
      checksum: dlc.dat_plain.yml.sha256sum
  china-operator-ip:
    repository: gaoyifan/china-operator-ip
    version: git-branch
    branch: ip-lists
    input:
      format: cidr-text
      path: china46.txt
  openai-voice:
    version: openai-voice
    input:
      format: openai-voice-json
      url: https://openai.com/chatgpt-voice.json
ruleSets:
  - id: openai
    source: dlc
    list: openai
    stablePath: stable/openai
    usages:
      route: { artifact: domains }
      dns-query: { artifact: domains }
      dns-response: { unavailable: empty }
  - id: anthropic
    source: dlc
    list: anthropic
    stablePath: stable/anthropic
    usages:
      route: { artifact: domains }
      dns-query: { artifact: domains }
      dns-response: { unavailable: empty }
  - id: google-deepmind
    source: dlc
    list: google-deepmind
    stablePath: stable/google-deepmind
    usages:
      route: { artifact: domains }
      dns-query: { artifact: domains }
      dns-response: { unavailable: empty }
  - id: china-ip
    source: china-operator-ip
    list: all
    stablePath: stable/china-ip
    usages:
      route: { artifact: route }
      dns-query: { unavailable: empty }
      dns-response: { artifact: route }
  - id: chatgpt-voice
    source: openai-voice
    list: all
    stablePath: stable/chatgpt-voice
    usages:
      route: { artifact: route }
      dns-query: { unavailable: empty }
      dns-response: { artifact: route }
